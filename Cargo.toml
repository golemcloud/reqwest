[package]
name = "reqwest"
version = "0.12.15"
description = "higher level HTTP client library"
keywords = ["http", "request", "client"]
categories = ["web-programming::http-client", "wasm"]
repository = "https://github.com/seanmonstar/reqwest"
documentation = "https://docs.rs/reqwest"
authors = ["Sean McArthur <sean@seanmonstar.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.64.0"
autotests = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "reqwest_unstable"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = ["charset"]

# Enables native-tls specific functionality not available by default.
charset = ["dep:encoding_rs"]
json = ["dep:serde_json"]
multipart = ["dep:mime_guess", "dep:rand"]
async = [
    "dep:wasi-async-runtime",
    "dep:async-iterator",
    "dep:futures-concurrency",
    "dep:futures",
]

[dependencies]
base64 = "0.22"
http = "1"
url = "2.4"
bytes = "1.2"
mime = "0.3.16"
percent-encoding = "2.1"
serde = "1.0"
serde_urlencoded = "0.7.1"
wasi = "0.14.1+wasi-0.2.3"
# Optional deps...

## async
async-iterator = { version = "2.3.0", optional = true }
futures = { version = "0.3.31", optional = true }
futures-concurrency = { version = "7.6.3", optional = true }
wasi-async-runtime = { version = "0.1.2", optional = true }

## json
serde_json = { version = "1.0", optional = true }
## multipart
mime_guess = { version = "2.0", default-features = false, optional = true }
rand = { version = "0.9.1", optional = true }

encoding_rs = { version = "0.8", optional = true }

#[lib]
#crate-type = ["cdylib"]

[dev-dependencies]
tower = { version = "0.5.2", default-features = false, features = ["limit"] }
num_cpus = "1.0"
libc = "0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(reqwest_unstable)'] }
